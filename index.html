<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Toy Mania Ending</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Rye&display=swap');

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #21130b;
    font-family: "Rye", Georgia, serif;
}


/* =====================================
   画面全体
===================================== */

#ending {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #9c6836 0%,
            #533016 55%,
            #211109 100%
        );
}


/* =====================================
   最初に見えている背景
===================================== */

#beforeEnding {
    position: absolute;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        repeating-linear-gradient(
            90deg,
            #71431f 0px,
            #71431f 70px,
            #613719 72px,
            #613719 76px
        );

    transition:
        filter 0.5s ease,
        opacity 0.5s ease;
}


/* 木の板の線 */

#beforeEnding::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 110px,
            rgba(35,15,5,0.45) 112px,
            rgba(35,15,5,0.45) 116px
        );

    pointer-events: none;
}


#beforeEnding.fade {
    filter: brightness(0.45);
}


/* =====================================
   STARTボタン
===================================== */

#startButton {
    position: relative;
    z-index: 5;

    padding:
        22px 55px;

    border:
        7px solid #3b1c0b;

    outline:
        4px solid #d5a84c;

    border-radius: 8px;

    background:
        linear-gradient(
            #a9632b,
            #73401e
        );

    color: #fff0bd;

    font-family:
        "Rye",
        Georgia,
        serif;

    font-size:
        clamp(24px, 4vw, 55px);

    letter-spacing: 4px;

    text-shadow:
        3px 3px 0 #4b210d;

    box-shadow:
        0 12px 0 #3c1c0b,
        0 18px 25px rgba(0,0,0,0.55);

    cursor: pointer;
}


#startButton.hide {
    display: none;
}


/* =====================================
   カーテン
===================================== */

.curtain {
    position: absolute;

    top: -15%;

    width: 58%;
    height: 135%;

    z-index: 20;

    background:
        repeating-linear-gradient(
            90deg,
            #5d0005 0px,
            #8e0810 30px,
            #c11c22 60px,
            #81060c 90px,
            #4d0005 120px
        );

    box-shadow:
        inset 0 0 45px rgba(0,0,0,0.7),
        0 0 35px rgba(0,0,0,0.75);

    transition:
        transform 1.9s
        cubic-bezier(
            0.65,
            0,
            0.35,
            1
        );
}


/* 左 */

#curtainLeft {
    left: 0;

    transform:
        translateX(-108%)
        skewY(7deg);

    border-right:
        9px solid #c99a3c;
}


/* 右 */

#curtainRight {
    right: 0;

    transform:
        translateX(108%)
        skewY(-7deg);

    border-left:
        9px solid #c99a3c;
}


/* 閉じる */

#ending.closed #curtainLeft {
    transform:
        translateX(-7%)
        skewY(7deg);
}

#ending.closed #curtainRight {
    transform:
        translateX(7%)
        skewY(-7deg);
}


/* =====================================
   カーテン上部
===================================== */

#topCurtain {
    position: absolute;

    z-index: 25;

    top: -90px;
    left: -5%;

    width: 110%;
    height: 150px;

    background:
        repeating-linear-gradient(
            90deg,
            #650006,
            #a30d14 45px,
            #5b0005 90px
        );

    border-bottom:
        10px solid #c89b40;

    border-radius:
        0 0 50% 50%;

    box-shadow:
        0 10px 20px rgba(0,0,0,0.65);
}


/* =====================================
   ENDING内容
===================================== */

#finalScene {
    position: absolute;
    inset: 0;

    z-index: 30;

    pointer-events: none;
}


/* =====================================
   木の看板
===================================== */

#sign {
    position: absolute;

    left: 50%;
    top: 11%;

    transform:
        translate(-50%, -40px)
        scale(0.75);

    width:
        min(760px, 78vw);

    padding:
        24px 35px;

    text-align: center;

    background:
        repeating-linear-gradient(
            0deg,
            #a96731 0px,
            #a96731 20px,
            #925426 22px,
            #925426 25px
        );

    border:
        9px solid #4a260f;

    outline:
        4px solid #d2a24c;

    border-radius: 15px;

    box-shadow:
        0 15px 25px rgba(0,0,0,0.6),
        inset 0 0 20px rgba(70,25,5,0.5);

    opacity: 0;

    transition:
        opacity 0.6s ease,
        transform 0.8s
        cubic-bezier(
            0.2,
            1.4,
            0.4,
            1
        );
}


#sign.show {
    opacity: 1;

    transform:
        translate(-50%, 0)
        scale(1);
}


/* =====================================
   またきてね！
===================================== */

#message {
    color: #fff0b8;

    font-size:
        clamp(40px, 7vw, 100px);

    line-height: 1.1;

    letter-spacing: 5px;

    text-shadow:
        4px 4px 0 #54240d,
        -2px -2px 0 #54240d,
        0 7px 8px rgba(0,0,0,0.45);
}


/* =====================================
   ウッディ
===================================== */

#woody {
    position: absolute;

    z-index: 35;

    left: 50%;
    bottom: -4%;

    height: 69vh;
    max-width: 72vw;

    object-fit: contain;

    transform:
        translateX(-50%)
        translateY(115%);

    opacity: 0;

    filter:
        drop-shadow(
            0 10px 12px
            rgba(0,0,0,0.55)
        );

    transition:
        transform 1s
        cubic-bezier(
            0.2,
            1.35,
            0.4,
            1
        ),
        opacity 0.35s ease;
}


#woody.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =====================================
   星・キラキラ
===================================== */

.sparkle {
    position: absolute;

    z-index: 40;

    color: #ffe58a;

    font-size:
        clamp(25px, 4vw, 55px);

    opacity: 0;

    text-shadow:
        0 0 12px #fff1a0;

    animation:
        sparkle 1.1s
        infinite alternate;
}


#sparkle1 {
    left: 17%;
    top: 25%;
}

#sparkle2 {
    right: 17%;
    top: 32%;

    animation-delay: 0.35s;
}

#sparkle3 {
    left: 25%;
    bottom: 17%;

    animation-delay: 0.7s;
}


.sparkle.show {
    opacity: 1;
}


@keyframes sparkle {

    from {
        transform:
            scale(0.55)
            rotate(0deg);
    }

    to {
        transform:
            scale(1.25)
            rotate(25deg);
    }

}

</style>
</head>


<body>

<div id="ending">


    <!-- 最初のテスト画面 -->

    <div id="beforeEnding">

        <button id="startButton">
            ENDING START
        </button>

    </div>


    <!-- 左右カーテン -->

    <div
        id="curtainLeft"
        class="curtain">
    </div>

    <div
        id="curtainRight"
        class="curtain">
    </div>


    <!-- 上カーテン -->

    <div id="topCurtain"></div>


    <!-- 最後の画面 -->

    <div id="finalScene">


        <!-- 看板 -->

        <div id="sign">

            <div id="message">
                またきてね！
            </div>

        </div>


        <!-- ウッディ -->

        <img
            id="woody"
            src="woody.png"
            alt="">


        <!-- キラキラ -->

        <div
            id="sparkle1"
            class="sparkle">
            ✦
        </div>

        <div
            id="sparkle2"
            class="sparkle">
            ✦
        </div>

        <div
            id="sparkle3"
            class="sparkle">
            ✦
        </div>


    </div>

</div>


<script>

const ending =
    document.getElementById(
        "ending"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const beforeEnding =
    document.getElementById(
        "beforeEnding"
    );

const sign =
    document.getElementById(
        "sign"
    );

const woody =
    document.getElementById(
        "woody"
    );

const sparkles =
    document.querySelectorAll(
        ".sparkle"
    );


function startEnding() {


    /* ボタンを消す */

    startButton.classList.add(
        "hide"
    );


    /* 背景を暗く */

    beforeEnding.classList.add(
        "fade"
    );


    /* カーテンが閉じる */

    setTimeout(
        function () {

            ending.classList.add(
                "closed"
            );

        },
        350
    );


    /* 木の看板 */

    setTimeout(
        function () {

            sign.classList.add(
                "show"
            );

        },
        2500
    );


    /* ウッディ登場 */

    setTimeout(
        function () {

            woody.classList.add(
                "show"
            );

        },
        2900
    );


    /* キラキラ */

    setTimeout(
        function () {

            sparkles.forEach(
                function (sparkle) {

                    sparkle.classList.add(
                        "show"
                    );

                }
            );

        },
        3400
    );

}


startButton.addEventListener(
    "click",
    startEnding
);

</script>

</body>
</html>
