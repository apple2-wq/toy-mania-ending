<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Toy Mania Ending</title>


<style>

@import url(
'https://fonts.googleapis.com/css2?family=Rye&display=swap'
);


/* =====================================
   基本
===================================== */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #1c1008;
}


body {

    font-family:
        "Rye",
        Georgia,
        serif;
}


/* =====================================
   画面全体
===================================== */

#ending {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #9a6533 0%,
            #5b3419 55%,
            #281308 100%
        );
}


/* =====================================
   テスト用背景
===================================== */

#beforeEnding {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        repeating-linear-gradient(
            90deg,

            #74441f 0px,
            #74441f 75px,

            #633818 76px,
            #633818 80px
        );

    transition:
        filter 0.5s ease;
}


#beforeEnding::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            0deg,

            transparent 0px,
            transparent 115px,

            rgba(
                40,
                17,
                6,
                0.45
            ) 117px,

            rgba(
                40,
                17,
                6,
                0.45
            ) 121px
        );

    pointer-events: none;
}


#beforeEnding.fade {

    filter:
        brightness(0.4);
}


/* =====================================
   テスト用STARTボタン
===================================== */

#startButton {

    position: relative;

    z-index: 5;

    padding:
        20px
        48px;

    border:
        6px solid #3e1e0b;

    outline:
        4px solid #d7a744;

    border-radius: 8px;

    background:
        linear-gradient(
            #a8622c,
            #713d1c
        );

    color: #ffedb3;

    font-family:
        "Rye",
        Georgia,
        serif;

    font-size:
        clamp(
            23px,
            4vw,
            52px
        );

    letter-spacing: 3px;

    text-shadow:
        3px 3px 0
        #4b210d;

    box-shadow:
        0 11px 0
        #3b1b0a,

        0 18px 25px
        rgba(
            0,
            0,
            0,
            0.5
        );

    cursor: pointer;
}


#startButton.hide {

    display: none;
}


/* =====================================
   左右カーテン
===================================== */

.curtain {

    position: absolute;

    top: -15%;

    width: 58%;
    height: 135%;

    z-index: 20;

    background:
        repeating-linear-gradient(
            90deg,

            #4c0005 0px,

            #750008 25px,

            #ad1118 55px,

            #d02a2e 72px,

            #930910 100px,

            #570006 130px
        );

    box-shadow:
        inset 0 0 50px
        rgba(
            0,
            0,
            0,
            0.72
        ),

        0 0 35px
        rgba(
            0,
            0,
            0,
            0.7
        );

    transition:
        transform
        1.9s
        cubic-bezier(
            0.65,
            0,
            0.35,
            1
        );
}


/* 左 */

#curtainLeft {

    left: 0;

    transform:
        translateX(-108%)
        skewY(7deg);

    border-right:
        8px solid
        #c99a3c;
}


/* 右 */

#curtainRight {

    right: 0;

    transform:
        translateX(108%)
        skewY(-7deg);

    border-left:
        8px solid
        #c99a3c;
}


/* 閉じた状態 */

#ending.closed
#curtainLeft {

    transform:
        translateX(-7%)
        skewY(7deg);
}


#ending.closed
#curtainRight {

    transform:
        translateX(7%)
        skewY(-7deg);
}


/* =====================================
   最後の画面
===================================== */

#finalScene {

    position: absolute;

    inset: 0;

    z-index: 30;

    pointer-events: none;
}


/* =====================================
   看板
===================================== */

#sign {

    position: absolute;

    left: 10%;
    top: 20%;

    width: 52vw;
    height: 54vh;

    opacity: 0;

    transform:
        translateX(-40vw)
        scale(0.25)
        rotate(-8deg);

    transform-origin:
        center;

    transition:
        opacity 0.15s ease,

        transform 0.72s
        cubic-bezier(
            0.18,
            1.55,
            0.35,
            1
        );
}


/* ひょこっ */

#sign.pop {

    opacity: 1;

    transform:
        translateX(0)
        scale(1)
        rotate(-1deg);
}


/* =====================================
   看板の揺れ
===================================== */

#sign.swing {

    animation:
        signSwing
        3.8s
        ease-in-out
        infinite;
}


@keyframes signSwing {

    0% {

        transform:
            translateY(0)
            rotate(-1.5deg);
    }

    50% {

        transform:
            translateY(-10px)
            rotate(1.5deg);
    }

    100% {

        transform:
            translateY(0)
            rotate(-1.5deg);
    }
}


/* =====================================
   看板の棒
===================================== */

#signPost {

    position: absolute;

    left: 47%;
    top: 54%;

    width: 7%;
    height: 60%;

    transform:
        translateX(-50%)
        rotate(-1deg);

    background:
        linear-gradient(
            90deg,

            #5c2b0c,
            #b56d2b,
            #7b3d13,
            #4c230b
        );

    border:
        4px solid
        #442008;

    border-radius: 8px;

    box-shadow:
        inset 0 0 10px
        rgba(
            0,
            0,
            0,
            0.5
        ),

        5px 8px 10px
        rgba(
            0,
            0,
            0,
            0.4
        );
}


/* =====================================
   木の板
===================================== */

.wood {

    position: absolute;

    left: 0;

    width: 100%;
    height: 24%;

    border: none;

    border-radius:
        13px 18px 11px 16px;

    box-shadow:
        inset 0 0 14px
        rgba(
            70,
            25,
            5,
            0.35
        ),

        5px 7px 8px
        rgba(
            0,
            0,
            0,
            0.22
        );
}


/* 明るい */

#wood1 {

    top: 3%;

    transform:
        rotate(-3deg);

    background:
        repeating-linear-gradient(
            0deg,

            #d28a43 0px,
            #d28a43 13px,

            #bd7132 15px,
            #bd7132 19px
        );
}


/* 濃い */

#wood2 {

    top: 21%;

    width: 94%;
    left: 4%;

    transform:
        rotate(2deg);

    background:
        repeating-linear-gradient(
            0deg,

            #7e3b14 0px,
            #7e3b14 13px,

            #60280c 15px,
            #60280c 19px
        );
}


/* 明るい */

#wood3 {

    top: 39%;

    width: 101%;
    left: -1%;

    transform:
        rotate(-1deg);

    background:
        repeating-linear-gradient(
            0deg,

            #c77835 0px,
            #c77835 13px,

            #ad6027 15px,
            #ad6027 19px
        );
}


/* 濃い */

#wood4 {

    top: 57%;

    width: 91%;
    left: 5%;

    transform:
        rotate(2.5deg);

    background:
        repeating-linear-gradient(
            0deg,

            #6d300d 0px,
            #6d300d 13px,

            #4f2007 15px,
            #4f2007 19px
        );
}


/* =====================================
   またきてね！
===================================== */

#message {

    position: absolute;

    z-index: 10;

    left: 50%;
    top: 41%;

    transform:
        translate(-50%, -50%)
        rotate(-1deg);

    width: 96%;

    text-align: center;

    color: #ffd447;

    font-family:
        "Rye",
        Georgia,
        serif;

    font-size:
        clamp(
            46px,
            6.8vw,
            112px
        );

    font-weight: 900;

    line-height: 1;

    letter-spacing: 4px;

    white-space: nowrap;

    -webkit-text-stroke:
        2.5px #ffe98a;

    text-shadow:
        4px 4px 0 #7a3a0b,
        0 7px 8px
        rgba(
            0,
            0,
            0,
            0.45
        );
}


/* =====================================
   ウッディ
===================================== */

#woody {

    position: absolute;

    z-index: 35;

    right: -2%;
    bottom: -10%;

    height: 125vh;
    width: auto;

    max-width: 48vw;

    object-fit: contain;

    opacity: 0;

    transform:
        translateY(110%)
        scale(0.7)
        rotate(3deg);

    transform-origin:
        center bottom;

    filter:
        drop-shadow(
            0 14px 15px
            rgba(
                0,
                0,
                0,
                0.55
            )
        );

    transition:
        opacity 0.2s ease,
        transform 0.85s
        cubic-bezier(
            0.18,
            1.55,
            0.35,
            1
        );
}


/* ひょこっ */

#woody.pop {

    opacity: 1;

    transform:
        translateY(0)
        scale(1)
        rotate(0deg);
}


/* =====================================
   ウッディの揺れ
===================================== */

#woody.wave {

    animation:
        woodyMove
        3.3s
        ease-in-out
        infinite;
}


@keyframes woodyMove {

    0% {

        transform:
            translateY(0)
            rotate(-1deg);
    }

    50% {

        transform:
            translateY(-12px)
            rotate(1.5deg);
    }

    100% {

        transform:
            translateY(0)
            rotate(-1deg);
    }
}


/* =====================================
   キラキラ
===================================== */

.sparkle {

    position: absolute;

    z-index: 50;

    color: #ffe36b;

    font-size:
        clamp(
            45px,
            7vw,
            105px
        );

    opacity: 0;

    text-shadow:
        0 0 10px #fff5af,
        0 0 25px #ffc83d;

    transition:
        opacity
        0.35s ease;
}


.sparkle.show {

    opacity: 1;

    animation:
        sparkleMove
        1.8s
        ease-in-out
        infinite;
}


/* キラキラ位置 */

#sparkle1 {

    left: 4%;
    top: 14%;
}


#sparkle2 {

    left: 49%;
    top: 13%;

    animation-delay:
        0.4s;
}


#sparkle3 {

    left: 47%;
    bottom: 10%;

    animation-delay:
        0.8s;
}


#sparkle4 {

    right: 4%;
    top: 13%;

    animation-delay:
        1.1s;
}


@keyframes sparkleMove {

    0% {

        transform:
            scale(0.65)
            rotate(-15deg);

        filter:
            brightness(0.8);
    }

    50% {

        transform:
            scale(1.3)
            rotate(15deg);

        filter:
            brightness(1.35);
    }

    100% {

        transform:
            scale(0.65)
            rotate(-15deg);

        filter:
            brightness(0.8);
    }
}

</style>

</head>


<body>

<div id="ending">


    <!-- テスト用背景 -->

    <div id="beforeEnding">

        <button id="startButton">

            ENDING START

        </button>

    </div>


    <!-- 左右カーテン -->

    <div
        id="curtainLeft"
        class="curtain">
    </div>


    <div
        id="curtainRight"
        class="curtain">
    </div>


    <!-- 最後の画面 -->

    <div id="finalScene">


        <!-- 看板 -->

        <div id="sign">


            <!-- 棒 -->

            <div id="signPost">
            </div>


            <!-- 木の板 -->

            <div
                id="wood1"
                class="wood">
            </div>


            <div
                id="wood2"
                class="wood">
            </div>


            <div
                id="wood3"
                class="wood">
            </div>


            <div
                id="wood4"
                class="wood">
            </div>


            <!-- 文字 -->

            <div id="message">

                またきてね！

            </div>


        </div>


        <!-- ウッディ -->

        <img
            id="woody"
            src="woody.png"
            alt=""
        >


        <!-- キラキラ -->

        <div
            id="sparkle1"
            class="sparkle">
            ✦
        </div>


        <div
            id="sparkle2"
            class="sparkle">
            ✦
        </div>


        <div
            id="sparkle3"
            class="sparkle">
            ✦
        </div>


        <div
            id="sparkle4"
            class="sparkle">
            ✦
        </div>


    </div>


</div>


<script>


const ending =
    document.getElementById(
        "ending"
    );


const beforeEnding =
    document.getElementById(
        "beforeEnding"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const sign =
    document.getElementById(
        "sign"
    );


const woody =
    document.getElementById(
        "woody"
    );


const sparkles =
    document.querySelectorAll(
        ".sparkle"
    );


/* =====================================
   エンディング開始
===================================== */

function startEnding() {


    /* ボタンを消す */

    startButton.classList.add(
        "hide"
    );


    /* 後ろを暗くする */

    beforeEnding.classList.add(
        "fade"
    );


    /* =================================
       カーテンを閉じる
    ================================= */

    setTimeout(
        function () {

            ending.classList.add(
                "closed"
            );

        },

        300
    );


    /* =================================
       ウッディが先にひょこっ！
    ================================= */

    setTimeout(
        function () {

            woody.classList.add(
                "pop"
            );

        },

        2350
    );


    /* =================================
       そのあと看板がひょこっ！
    ================================= */

    setTimeout(
        function () {

            sign.classList.add(
                "pop"
            );

        },

        2800
    );


    /* =================================
       キラキラ開始
    ================================= */

    setTimeout(
        function () {

            sparkles.forEach(

                function (
                    sparkle
                ) {

                    sparkle.classList.add(
                        "show"
                    );

                }

            );

        },

        3200
    );


    /* =================================
       最後はずっと揺れる
    ================================= */

    setTimeout(
        function () {

            sign.classList.add(
                "swing"
            );


            woody.classList.add(
                "wave"
            );

        },

        3700
    );

}


/* =====================================
   テスト用
===================================== */

startButton.addEventListener(
    "click",
    startEnding
);


</script>


</body>

</html>
